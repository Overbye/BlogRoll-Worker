name: Scheduled Deploy

on:
  workflow_dispatch:
  schedule:
    # 临时提高频率以验证新的 GitHub 定时触发器；验证后恢复为每天两次。
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: blogroll-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate RSS data
        run: npm run gen
      - name: Build site
        run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKERS_TOKEN }}
          command: deploy
